sdk-version: 3.3.0-snapshot.20250507.0
name: splice-wallet
source: daml
version: 0.1.16
dependencies:
  - daml-prim
  - daml-stdlib
data-dependencies:
- ../../token-standard/splice-api-token-holding-v1/.daml/dist/splice-api-token-holding-v1-1.0.0.dar
- ../../token-standard/splice-api-token-metadata-v1/.daml/dist/splice-api-token-metadata-v1-1.0.0.dar
- ../../token-standard/splice-api-token-transfer-instruction-v1/.daml/dist/splice-api-token-transfer-instruction-v1-1.0.0.dar
- ../../token-standard/splice-api-token-allocation-instruction-v1/.daml/dist/splice-api-token-allocation-instruction-v1-1.0.0.dar
- ../../token-standard/splice-api-token-allocation-v1/.daml/dist/splice-api-token-allocation-v1-1.0.0.dar
- ../splice-amulet/.daml/dist/splice-amulet-0.1.14.dar
- ../splice-util/.daml/dist/splice-util-0.1.4.dar
- ../splice-wallet-payments/.daml/dist/splice-wallet-payments-0.1.14.dar
build-options:
  - --ghc-option=-Wunused-binds
  - --ghc-option=-Wunused-matches
  - -Wno-deprecated-exceptions
  - -Wno-ledger-time-is-alpha
  - --target=2.1
codegen:
  java:
    package-prefix: org.lfdecentralizedtrust.splice.codegen.java
    decoderClass: org.lfdecentralizedtrust.splice.codegen.java.DecoderSpliceWallet
    output-directory: target/daml-codegen-java
